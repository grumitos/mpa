<div class="login-container">
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
    <div class="logo-container">
      <div class="app-logo outfit-bold">M</div>
    </div>
    
    <h2 class="outfit-bold">Iniciar Sesión</h2>    <div class="form-group">
      <label for="email" class="form-label outfit-medium">Email:</label>
      <input type="email"
             id="email"
             name="email"
             class="form-control"
             [(ngModel)]="credentials.email"
             required
             #email="ngModel"
             [ngClass]="{ 'is-invalid': loginForm.submitted && email.invalid }"
             placeholder="Ingrese su email">
      <div *ngIf="loginForm.submitted && email.invalid" class="form-error">
        <div *ngIf="email.errors?.['required']">El email es requerido.</div>
        <div *ngIf="email.errors?.['email']">Ingrese un email válido.</div>
      </div>
    </div>

    <div class="form-group">
      <label for="password" class="form-label outfit-medium">Contraseña:</label>
      <div class="password-input-container">
        <input [type]="showPassword ? 'text' : 'password'"
               id="password"
               name="password"
               class="form-control"
               [(ngModel)]="credentials.password"
               required
               #password="ngModel"
               [ngClass]="{ 'is-invalid': loginForm.submitted && password.invalid }"
               placeholder="Ingrese su contraseña">
        <button type="button" class="password-toggle" (click)="togglePasswordVisibility()">
          <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
      <div *ngIf="loginForm.submitted && password.invalid" class="form-error">
        <div *ngIf="password.errors?.['required']">La contraseña es requerida.</div>
      </div>
    </div>

    <div class="form-row remember-forgot">
      <div class="form-check">
        <input type="checkbox" id="remember" name="remember" class="form-check-input" [(ngModel)]="rememberMe">
        <label for="remember" class="form-check-label outfit-regular">Recordarme</label>
      </div>
      <a href="javascript:void(0)" class="forgot-link outfit-medium">¿Olvidaste tu contraseña?</a>
    </div>

    <div *ngIf="loginError" class="error-message outfit-medium">
      {{ loginError }}
    </div>

    <button type="submit" class="btn-submit outfit-semibold" [disabled]="isLoading">
      <span *ngIf="isLoading">Iniciando sesión...</span>
      <span *ngIf="!isLoading">Entrar</span>
    </button>
  </form>
</div>
