<div class="horario">
  <div class="header">
    <h2>Horario</h2>
    <button mat-raised-button (click)="nuevo()">
      <mat-icon>add</mat-icon> Nuevo
    </button>
  </div>

  <mat-card *ngIf="mostrForm" class="form-card">
    <form [formGroup]="formulario">
      <div class="fila">
        <mat-form-field appearance="outline">
          <mat-label>Día</mat-label>
          <input matInput formControlName="dia">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Inicio</mat-label>
          <input matInput type="time" formControlName="horaInicio">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Fin</mat-label>
          <input matInput type="time" formControlName="horaFin">
        </mat-form-field>
      </div>
      <div class="fila">
        <mat-form-field appearance="outline">
          <mat-label>Curso</mat-label>
          <input matInput formControlName="materia">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Aula</mat-label>
          <input matInput formControlName="aula">
        </mat-form-field>
      </div>
      <div class="acciones">
        <button mat-button (click)="cancelar()">Cancelar</button>
        <button mat-raised-button color="primary" (click)="guardar()">Guardar</button>
      </div>
    </form>
  </mat-card>

  <mat-card>
    <table mat-table [dataSource]="horarios" class="mat-elevation-z4">
      <ng-container matColumnDef="dia">
        <th mat-header-cell *matHeaderCellDef>Día</th>
        <td mat-cell *matCellDef="let h">{{ h.dia }}</td>
      </ng-container>
      <ng-container matColumnDef="horaInicio">
        <th mat-header-cell *matHeaderCellDef>Inicio</th>
        <td mat-cell *matCellDef="let h">{{ h.horaInicio }}</td>
      </ng-container>
      <ng-container matColumnDef="horaFin">
        <th mat-header-cell *matHeaderCellDef>Fin</th>
        <td mat-cell *matCellDef="let h">{{ h.horaFin }}</td>
      </ng-container>
      <ng-container matColumnDef="materia">
        <th mat-header-cell *matHeaderCellDef>Materia</th>
        <td mat-cell *matCellDef="let h">{{ h.materia }}</td>
      </ng-container>
      <ng-container matColumnDef="aula">
        <th mat-header-cell *matHeaderCellDef>Aula</th>
        <td mat-cell *matCellDef="let h">{{ h.aula }}</td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let h">
          <button mat-icon-button (click)="editar(h)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminar(h.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>
  </mat-card>

   <div class="schedule-container">
    <div class="schedule-header">
      <div class="time-column"></div>
      <div class="day-column" *ngFor="let d of dias">{{ d }}</div>
    </div>
    <div class="schedule-body">
      <div class="time-slot" *ngFor="let h of horas">{{ h }}</div>
      <ng-container *ngFor="let ev of horarios">
        <div class="event" [ngStyle]="getEventStyle(ev)">
          {{ ev.materia }}<br><small>{{ ev.aula }}</small>
        </div>
      </ng-container>
    </div>
  </div>
</div>
